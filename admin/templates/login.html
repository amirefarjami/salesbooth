{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}ورود — باجه چیز{% endblock %}
{% block body %}
<div class="panel" style="max-width:360px; margin:60px auto;">
  <h2>ورود مدیریت</h2>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <p><input type="password" name="pin" placeholder="PIN" inputmode="numeric" autofocus></p>
    <button type="submit">ورود</button>
  </form>
</div>
{% endblock %}
